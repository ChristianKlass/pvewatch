image: python:3.12

stages:
  - lint
  - test
  - sonarqube
  - docker

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - pip install --quiet -e ".[dev]" || pip install --quiet -e . pytest ruff

lint:
  stage: lint
  script:
    - ruff check src/ tests/
    - ruff format --check src/ tests/

test:
  stage: test
  script:
    - python -m pytest tests/ -v --cov=pvewatch --cov-report=xml:coverage.xml
  artifacts:
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

sonarqube:
  stage: sonarqube
  before_script: []
  dependencies:
    - test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  only:
    - merge_requests
    - main

# Push every commit to the GitLab Container Registry using CI_JOB_TOKEN (no credentials needed)
docker-dev:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:dev" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:dev"

# Public release images are built by GitHub Actions and pushed to GHCR
# (.github/workflows/ci.yml); deploy to the homelab now happens via Flux, not this pipeline.

# The deploy job (kubectl apply via a pvewatch-deployer service-account token, --insecure-skip-tls-verify)
# was removed 2026-09-28 (stage 4: one deploy path) -- Flux now applies k8s/pvewatch/ in the k8s repo
# instead. The pvewatch-deployer service account and its CI variables (K8S_SERVER, K8S_TOKEN,
# GITLAB_DEPLOY_TOKEN_USER/TOKEN, PVE_*, ALERT_EMAIL_*, DATABASE_URL) are cleaned up separately
# once a Flux-driven rollout is proven (see k8s repo pvewatch MR).
