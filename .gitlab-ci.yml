image: python:3.12

stages:
  - lint
  - test
  - sonarqube
  - docker

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - pip install --quiet -e ".[dev]" || pip install --quiet -e . pytest ruff

# Leak gate (2026-10-06): GitHub mirrors this repo, so nothing private may reach main.
# Secrets in the new commits (gitleaks) and Mark's LAN, internal hostnames and home paths
# anywhere in the tree fail the pipeline; merges require a passing pipeline.
leak-check:
  stage: lint
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  before_script: []
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks git . --log-opts="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD~1}..HEAD" --no-banner --redact
    - |
      if git grep -nIE '192\.168\.50\.[0-9]+|\.homelab\.internal|/home/mark|(git|registry)\.markklass\.dev' -- ':!.gitlab-ci.yml'; then
        echo "Private infrastructure detail found above: remove it before merging"
        exit 1
      fi

lint:
  stage: lint
  script:
    - ruff check src/ tests/
    - ruff format --check src/ tests/

test:
  stage: test
  script:
    - python -m pytest tests/ -v --cov=pvewatch --cov-report=xml:coverage.xml
  artifacts:
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

sonarqube:
  stage: sonarqube
  before_script: []
  dependencies:
    - test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  only:
    - merge_requests
    - main

# Push every commit to the GitLab Container Registry using CI_JOB_TOKEN (no credentials needed)
docker-dev:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    # main-<unixts>-<shortsha> sorts by build time, so Flux image automation can pick the newest
    - TS="$(date +%s)"
    - SORTABLE="main-${TS}-${CI_COMMIT_SHORT_SHA}"
    - docker build -t "$CI_REGISTRY_IMAGE:$SORTABLE" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:dev" .
    - docker push "$CI_REGISTRY_IMAGE:$SORTABLE"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:dev"

# Public release images are built by GitHub Actions and pushed to GHCR
# (.github/workflows/ci.yml). Deploys to the homelab happen via Flux, not this pipeline.
